<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Weblin Studio Corrigido</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#0b0f1a;color:#fff;font-family:sans-serif;margin:0;padding:0;}
header{height:50px;background:#020617;display:flex;align-items:center;justify-content:space-between;padding:0 10px;}
.container{padding:10px;height:calc(100vh - 50px);overflow-y:auto;}
.project{background:#020617;padding:10px;border-radius:8px;margin-bottom:10px;cursor:pointer;}
.fab{position:fixed;bottom:10px;right:10px;width:50px;height:50px;border-radius:50%;background:#2563eb;color:white;border:none;font-size:26px;cursor:pointer;}
.editor{display:none;flex-direction:column;height:calc(100vh - 50px);}
.file-tabs{display:flex;overflow-x:auto;padding:5px;background:#020617;border-bottom:1px solid #1e293b;}
.file-tab{padding:5px 10px;margin-right:5px;background:#1e293b;border-radius:6px;cursor:pointer;}
.file-tab.active{background:#2563eb;}
.tabs{display:flex;background:#020617;border-bottom:1px solid #1e293b;}
.tab{padding:8px 12px;cursor:pointer;color:#9ca3af;}
.tab.active{color:white;border-bottom:2px solid #2563eb;}
textarea{flex:1;background:#0f1320;color:white;border:none;padding:10px;font-family:monospace;font-size:14px;outline:none;display:none;}
textarea.active{display:block;}
iframe{flex:1;border:none;display:none;}
iframe.active{display:block;}
.bottom-bar{height:40px;background:#020617;display:flex;justify-content:space-around;align-items:center;}
.bottom-bar button{background:none;border:none;color:white;cursor:pointer;}
</style>
</head>
<body>

<header>
<h1 id="title">Weblin Studio</h1>
<button onclick="goHome()">🏠</button>
</header>

<div class="container" id="home">
<h3>Seus Projetos</h3>
<div id="projectList"></div>
</div>

<button class="fab" onclick="createProject()">＋</button>

<div class="editor" id="editor">
  <div class="file-tabs" id="fileTabs"></div>
  <button onclick="createFile()">+ Novo Arquivo</button>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('html', this)">HTML</div>
    <div class="tab" onclick="switchTab('css', this)">CSS</div>
    <div class="tab" onclick="switchTab('js', this)">JS</div>
    <div class="tab" onclick="switchTab('weblin', this)">WEBLIN</div>
    <div class="tab" onclick="switchTab('preview', this)">PREVIEW</div>
  </div>
  <textarea id="html"></textarea>
  <textarea id="css"></textarea>
  <textarea id="js"></textarea>
  <textarea id="weblin"></textarea>
  <iframe id="preview"></iframe>

  <div class="bottom-bar">
    <button onclick="goHome()">Projetos</button>
    <button onclick="saveProject()">Salvar</button>
    <button onclick="runPreview()">Rodar</button>
  </div>
</div>

<script>
let currentProject=null,currentFile=null;

// Carregar lista de projetos
function loadProjects(){
  const list=document.getElementById("projectList");
  list.innerHTML="";
  const projects=JSON.parse(localStorage.getItem("weblin_projects")||"[]");
  projects.forEach(name=>{
    const div=document.createElement("div");
    div.className="project";
    div.innerText=name;
    div.onclick=()=>openProject(name);
    list.appendChild(div);
  });
}
loadProjects();

// Criar projeto
function createProject(){
  const name=prompt("Nome do projeto:");
  if(!name) return;
  const projects=JSON.parse(localStorage.getItem("weblin_projects")||"[]");
  if(projects.includes(name)){alert("Projeto já existe!"); return;}
  projects.push(name);
  localStorage.setItem("weblin_projects",JSON.stringify(projects));
  const data={files:{"index.html":{lang:"html",content:""}},currentFile:"index.html"};
  localStorage.setItem("project_"+name,JSON.stringify(data));
  loadProjects();
}

// Abrir projeto
function openProject(name){
  currentProject=name;
  const data=JSON.parse(localStorage.getItem("project_"+name));
  currentFile=data.currentFile;
  loadFileTabs(data);
  loadFileContent();
  document.getElementById("home").style.display="none";
  document.getElementById("editor").style.display="flex";
  document.querySelector(".fab").style.display="none";
  document.getElementById("title").innerText=name;
}

// Voltar para home
function goHome(){
  document.getElementById("editor").style.display="none";
  document.getElementById("home").style.display="block";
  document.querySelector(".fab").style.display="flex";
  document.getElementById("title").innerText="Weblin Studio";
}

// Criar arquivo
function createFile(){
  if(!currentProject) return;
  saveCurrentFile();
  const fname=prompt("Nome do arquivo:");
  const lang=prompt("Linguagem? (html/css/js/weblin)").toLowerCase();
  if(!fname || !["html","css","js","weblin"].includes(lang)) return alert("Inválido!");
  const data=JSON.parse(localStorage.getItem("project_"+currentProject));
  data.files[fname]={lang,content:""};
  currentFile=fname;
  data.currentFile=currentFile;
  localStorage.setItem("project_"+currentProject,JSON.stringify(data));
  loadFileTabs(data);
  loadFileContent();
}

// Salvar arquivo atual
function saveCurrentFile(){
  if(!currentProject||!currentFile) return;
  const data=JSON.parse(localStorage.getItem("project_"+currentProject));
  const lang=data.files[currentFile].lang;
  const val=document.getElementById(lang).value;
  data.files[currentFile].content=val;
  data.currentFile=currentFile;
  localStorage.setItem("project_"+currentProject,JSON.stringify(data));
}

// Carregar abas de arquivos
function loadFileTabs(data){
  const tabs=document.getElementById("fileTabs");
  tabs.innerHTML="";
  for(let f in data.files){
    const div=document.createElement("div");
    div.className="file-tab"+(f===currentFile?" active":"");
    div.innerText=f+" ["+data.files[f].lang+"]";
    div.onclick=()=>{
      saveCurrentFile();
      currentFile=f;
      data.currentFile=currentFile;
      localStorage.setItem("project_"+currentProject,JSON.stringify(data));
      loadFileTabs(data);
      loadFileContent();
    };
    tabs.appendChild(div);
  }
}

// Carregar conteúdo do arquivo
function loadFileContent(){
  const data=JSON.parse(localStorage.getItem("project_"+currentProject));
  const f=data.files[currentFile];
  ["html","css","js","weblin"].forEach(id=>{
    const ta=document.getElementById(id);
    ta.value=f.lang===id?f.content:"";
    ta.classList.toggle("active",f.lang===id);
  });
}

// Alternar abas (HTML/CSS/JS/WEBLIN/PREVIEW)
function switchTab(tab,el){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
  ["html","css","js","weblin"].forEach(id=>{
    const ta=document.getElementById(id);
    ta.style.display="none";
    ta.classList.remove("active");
  });
  document.getElementById("preview").style.display="none";
  if(tab==="preview") document.getElementById("preview").style.display="block";
  else{
    document.getElementById(tab).style.display="block";
    document.getElementById(tab).classList.add("active");
  }
}

// Salvar projeto
function saveProject(){
  saveCurrentFile();
  alert("Salvo!");
}

// Rodar preview
function runPreview(){
  saveCurrentFile();
  const data=JSON.parse(localStorage.getItem("project_"+currentProject));
  let html="",css="",js="",weblin="";
  for(let f in data.files){
    const file=data.files[f];
    if(file.lang==="html") html+=file.content;
    else if(file.lang==="css") css+=file.content;
    else if(file.lang==="js") js+=file.content;
    else if(file.lang==="weblin") weblin+=file.content.replace(/h1\s+(.*)/g,"<h1>$1</h1>");
  }
  const doc=`<html><head><style>${css}</style></head><body>${html}${weblin}<script>${js}<\/script></body></html>`;
  const iframe=document.getElementById("preview");
  iframe.srcdoc=doc;
  switchTab("preview",document.querySelector(".tab:last-child"));
}
</script>

</body>
</html>
